version: 2
updates:
  # Keep GitHub Actions pinned and current
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns:
          - '*'
    labels:
      - type:infrastructure
      - area:devops
    commit-message:
      prefix: chore
      include: scope

  # npm workspaces
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
      production-dependencies:
        dependency-type: production
        patterns:
          - '*'
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: ioredis
        update-types: ['version-update:semver-major']
    labels:
      - type:infrastructure
      - area:devops
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
