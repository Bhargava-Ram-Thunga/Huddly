<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <radialGradient id="cinema-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B2438" />
      <stop offset="100%" stop-color="#131A2A" />
    </radialGradient>
    <filter id="logo-drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <linearGradient id="logo-butter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="45%" stop-color="#F2BB31" />
      <stop offset="100%" stop-color="#E5A61C" />
    </linearGradient>
    <linearGradient id="logo-cream-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF3E4" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="44" fill="url(#cinema-glow)" />

  <g transform="translate(36, 36)" filter="url(#logo-drop-shadow)">
    <!-- Kernel 1 (Top Left) -->
    <g class="kernel-top-left">
      <circle cx="36" cy="30" r="15" fill="#BF7118" opacity="0.25" />
      <circle cx="27" cy="22" r="11" fill="url(#logo-butter-grad)" />
      <circle cx="45" cy="21" r="12" fill="url(#logo-butter-grad)" />
      <circle cx="47" cy="37" r="11" fill="url(#logo-butter-grad)" />
      <circle cx="28" cy="37" r="10" fill="url(#logo-butter-grad)" />
      <circle cx="37" cy="28" r="13" fill="url(#logo-butter-grad)" />
      <circle cx="26" cy="20" r="6" fill="url(#logo-cream-grad)" opacity="0.9" />
      <circle cx="44" cy="19" r="7" fill="url(#logo-cream-grad)" opacity="0.9" />
      <circle cx="37" cy="26" r="6.5" fill="url(#logo-cream-grad)" opacity="0.95" />
      <circle cx="36" cy="31" r="3.5" fill="#BF7118" />
    </g>

    <!-- Kernel 2 (Bottom Left) -->
    <g class="kernel-bottom-left">
      <circle cx="36" cy="98" r="15" fill="#BF7118" opacity="0.25" />
      <circle cx="27" cy="90" r="11" fill="url(#logo-butter-grad)" />
      <circle cx="45" cy="91" r="12" fill="url(#logo-butter-grad)" />
      <circle cx="47" cy="107" r="11" fill="url(#logo-butter-grad)" />
      <circle cx="28" cy="107" r="10" fill="url(#logo-butter-grad)" />
      <circle cx="37" cy="100" r="13" fill="url(#logo-butter-grad)" />
      <circle cx="26" cy="88" r="6" fill="url(#logo-cream-grad)" opacity="0.9" />
      <circle cx="44" cy="89" r="7" fill="url(#logo-cream-grad)" opacity="0.9" />
      <circle cx="37" cy="98" r="6.5" fill="url(#logo-cream-grad)" opacity="0.95" />
      <circle cx="36" cy="101" r="3.5" fill="#BF7118" />
    </g>

    <!-- Kernel 3 (Right Apex) -->
    <g class="kernel-right-apex">
      <circle cx="98" cy="64" r="15" fill="#BF7118" opacity="0.25" />
      <circle cx="89" cy="55" r="11" fill="url(#logo-butter-grad)" />
      <circle cx="107" cy="57" r="12" fill="url(#logo-butter-grad)" />
      <circle cx="109" cy="73" r="11" fill="url(#logo-butter-grad)" />
      <circle cx="90" cy="73" r="10" fill="url(#logo-butter-grad)" />
      <circle cx="100" cy="64" r="13" fill="url(#logo-butter-grad)" />
      <circle cx="88" cy="53" r="6" fill="url(#logo-cream-grad)" opacity="0.9" />
      <circle cx="106" cy="55" r="7" fill="url(#logo-cream-grad)" opacity="0.9" />
      <circle cx="99" cy="62" r="6.5" fill="url(#logo-cream-grad)" opacity="0.95" />
      <circle cx="98" cy="65" r="3.5" fill="#BF7118" />
    </g>
  </g>
</svg>
